apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: parent-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - reorderSources: true
  template:
    metadata:
      name: 'multisource-app'
    spec:
      project: "default"
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
  templatePatch: |
    spec:
      sources:
      {{- if .reorderSources }}
        - repoURL: https://github.com/josse-muller/argocd-bug-reorder-sources
          path: "source1"
          targetRevision: main
        - repoURL: https://github.com/josse-muller/argocd-bug-reorder-sources-2
          path: "source2"
          targetRevision: main
      {{- else }}
        - repoURL: https://github.com/josse-muller/argocd-bug-reorder-sources-2
          path: "source2"
          targetRevision: main
        - repoURL: https://github.com/josse-muller/argocd-bug-reorder-sources
          path: "source1"
          targetRevision: main
      {{- end }}
